<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" />
    <title>Mebel Order — Admin</title>
    <script>
      // Mavzu va til React yuklanishidan oldin qo'llanadi — noto'g'ri rang "yalt" etmasin
      (function () {
        try {
          var theme = localStorage.getItem('mebel.admin.theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var locale = localStorage.getItem('mebel.admin.locale');
          if (locale) document.documentElement.lang = locale;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
