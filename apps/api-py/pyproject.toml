[project]
name = "mebel-api"
version = "0.1.0"
description = "Mebel Order backend (FastAPI)"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pydantic",
  "pydantic-settings",
  "pyjwt",
  "redis",
  "python-socketio",
  "python-multipart",
  "httpx",
  "openpyxl",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
per-file-ignores = { "app/scripts/seed.py" = ["E501"] }
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
