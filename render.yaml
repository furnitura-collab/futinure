# Render Blueprint — bepul sinov serveri: API + admin (/admin/) + mobil web (/)
# Render → New → Blueprint → shu repo. Postgres free 30 kundan keyin o'chadi.
services:
  - type: web
    name: mebel-order
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mebel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mebel-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      # Sinov rejimi: SMS yuborilmaydi, test raqamlar uchun kod 000000
      - key: DEMO_MODE
        value: "true"
      - key: OTP_TEST_PHONES
        value: "+998900000001,+998900000002,+998900000003,+998900000004,+998900000005"

  - type: keyvalue
    name: mebel-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: mebel-db
    plan: free
    region: frankfurt
    databaseName: mebel
    user: mebel
