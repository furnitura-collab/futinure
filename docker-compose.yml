services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mebel
      POSTGRES_PASSWORD: mebel
      POSTGRES_DB: mebel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mebel"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
